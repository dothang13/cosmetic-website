<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Blossom Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">Blossom.</a>
            <ul class="nav-links">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="products.html">Sản phẩm</a></li>
                <li><a href="about.html">Về chúng tôi</a></li>
                <li><a href="contact.html">Liên hệ</a></li>
            </ul>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-wrapper">
            <div class="auth-image">
                <img src="https://images.pexels.com/photos/2688991/pexels-photo-2688991.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Login Image">
                <div class="auth-overlay">
                    <h3>Welcome Back!</h3>
                    <p>Đăng nhập để nhận nhiều ưu đãi dành riêng cho thành viên Blossom.</p>
                </div>
            </div>

            <div class="auth-form">
                <h2>Đăng nhập</h2>
                <p class="auth-subtitle">Chào mừng bạn quay trở lại với Blossom</p>

                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" placeholder="name@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" id="login-password" placeholder="Nhập mật khẩu" required>
                    </div>
                    
                    <div class="form-options">
                        <label><input type="checkbox"> Ghi nhớ tôi</label>
                        <a href="#">Quên mật khẩu?</a>
                    </div>

                    <button type="submit" class="btn btn-full">Đăng nhập</button>
                </form>

                <p class="auth-switch">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
</body>
</html>
