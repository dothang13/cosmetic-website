<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - Blossom Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">Blossom.</a>
            <ul class="nav-links">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="products.html">Sản phẩm</a></li>
                <li><a href="about.html">Về chúng tôi</a></li>
                <li><a href="contact.html">Liên hệ</a></li>
            </ul>
            <div class="nav-icons">
                <a href="cart.html" style="position: relative;">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <div class="container" style="margin-top: 50px; margin-bottom: 80px;">
        <div class="page-header" style="background: transparent; padding: 0; text-align: left; margin-bottom: 30px; border: none;">
            <h2 style="color: var(--primary-hover);">Thông tin thanh toán</h2>
        </div>

        <form id="checkout-form" class="checkout-container">
            <div class="checkout-info">
                <div class="form-box">
                    <h3>Địa chỉ nhận hàng</h3>
                    <div class="form-group">
                        <label>Họ và tên</label>
                        <input type="text" id="fullname" required placeholder="Nguyễn Văn A">
                    </div>
                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="text" id="phone" required placeholder="09xxxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required placeholder="email@example.com">
                    </div>
                    <div class="form-group">
                        <label>Địa chỉ chi tiết</label>
                        <input type="text" id="address" required placeholder="Số nhà, đường, phường, quận...">
                    </div>
                    <div class="form-group">
                        <label>Ghi chú đơn hàng (Tùy chọn)</label>
                        <textarea id="note" rows="3" placeholder="Ví dụ: Giao giờ hành chính..."></textarea>
                    </div>
                </div>

                <div class="form-box" style="margin-top: 30px;">
                    <h3>Phương thức thanh toán</h3>
                    <div class="payment-methods">
                        <label class="payment-item">
                            <input type="radio" name="payment" value="cod" checked>
                            <span class="checkmark"></span>
                            <span>Thanh toán khi nhận hàng (COD)</span>
                        </label>
                        <label class="payment-item">
                            <input type="radio" name="payment" value="banking">
                            <span class="checkmark"></span>
                            <span>Chuyển khoản ngân hàng</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="checkout-summary">
                <div class="summary-box">
                    <h3>Đơn hàng của bạn</h3>
                    
                    <div id="order-items" class="order-list">
                        </div>

                    <div class="order-total">
                        <div class="row">
                            <span>Tạm tính</span>
                            <span id="sub-total">0₫</span>
                        </div>
                        <div class="row">
                            <span>Phí vận chuyển</span>
                            <span id="shipping-fee">30.000₫</span>
                        </div>
                        <div class="row total">
                            <span>Tổng cộng</span>
                            <span id="final-total" style="color: var(--primary-hover); font-size: 1.5rem;">0₫</span>
                        </div>
                    </div>

                    <button type="submit" class="btn" style="width: 100%; margin-top: 20px; padding: 15px;">ĐẶT HÀNG NGAY</button>
                    <a href="cart.html" style="display: block; text-align: center; margin-top: 15px; font-size: 0.9rem; text-decoration: underline;">Quay lại giỏ hàng</a>
                </div>
            </div>
        </form>
    </div>

    <script src="assets/js/db.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/checkout.js"></script>
</body>
</html>
