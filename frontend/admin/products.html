<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="fa-solid fa-spa"></i> Blossom Admin</div>
        <nav>
            <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-chart-pie"></i> Tổng quan</a>
            <a href="products.html" class="menu-item active"><i class="fa-solid fa-box-open"></i> Sản phẩm</a>
            <a href="orders.html" class="menu-item"><i class="fa-solid fa-cart-shopping"></i> Đơn hàng</a>
            <a href="../index.html" class="menu-item"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng xuất</a>
        </nav>
    </div>

    <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 class="header-title" style="margin-bottom: 0;">Danh sách sản phẩm</h2>
            <button onclick="alert('Chức năng Thêm đang phát triển!')" style="background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
                <i class="fa-solid fa-plus"></i> Thêm mới
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Hình ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Giá</th>
                        <th>Danh mục</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="product-table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script src="../assets/js/db.js"></script>
    <script src="main.js"></script>
</body>
</html>
