<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu - Blossom Store</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <div class="container navbar">
        <a href="index.html" class="logo">Blossom.</a>
      </div>
    </header>

    <div class="auth-container">
      <div class="auth-wrapper">
        <div
          class="auth-form"
          style="width: 100%; max-width: 400px; margin: 0 auto"
        >
          <h2>Khôi phục mật khẩu</h2>

          <form id="step1-form">
            <p class="auth-subtitle">Nhập email để nhận mã xác thực (OTP)</p>
            <div class="form-group">
              <label>Email đăng ký</label>
              <input
                type="email"
                id="email"
                required
                placeholder="Nhập email của bạn..."
              />
            </div>
            <button type="submit" class="btn btn-full">Gửi mã OTP</button>
          </form>

          <form id="step2-form" style="display: none">
            <p class="auth-subtitle" style="color: green">
              Mã OTP đã được gửi! Vui lòng kiểm tra.
            </p>

            <div class="form-group">
              <label>Mã OTP (6 số)</label>
              <input
                type="text"
                id="otp"
                required
                placeholder="Nhập mã OTP..."
              />
            </div>
            <div class="form-group">
              <label>Mật khẩu mới</label>
              <input
                type="password"
                id="new-password"
                required
                placeholder="Nhập mật khẩu mới..."
              />
            </div>

            <button type="submit" class="btn btn-full">Đổi mật khẩu</button>
          </form>

          <p class="auth-switch" style="margin-top: 20px">
            <a href="login.html">Quay lại Đăng nhập</a>
          </p>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "http://localhost:3000/api/auth";
      const step1Form = document.getElementById("step1-form");
      const step2Form = document.getElementById("step2-form");
      let userEmail = ""; // Lưu email để dùng cho bước 2

      // XỬ LÝ BƯỚC 1: GỬI YÊU CẦU OTP
      step1Form.addEventListener("submit", async (e) => {
        e.preventDefault();
        userEmail = document.getElementById("email").value;

        try {
          const res = await fetch(`${API_URL}/forgot-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: userEmail }),
          });
          const data = await res.json();

          if (res.ok) {
            alert(
              "✅ " +
                data.message +
                "\n(Hãy xem cửa sổ CMD/Terminal chạy Server để lấy mã)"
            );
            // Chuyển sang bước 2
            step1Form.style.display = "none";
            step2Form.style.display = "block";
          } else {
            alert("❌ " + data.message);
          }
        } catch (err) {
          console.error(err);
          alert("Lỗi kết nối Server");
        }
      });

      // XỬ LÝ BƯỚC 2: ĐỔI MẬT KHẨU
      step2Form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const otp = document.getElementById("otp").value;
        const newPassword = document.getElementById("new-password").value;

        try {
          const res = await fetch(`${API_URL}/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: userEmail,
              otp: otp,
              newPassword: newPassword,
            }),
          });
          const data = await res.json();

          if (res.ok) {
            alert("🎉 " + data.message);
            window.location.href = "login.html";
          } else {
            alert("❌ " + data.message);
          }
        } catch (err) {
          console.error(err);
          alert("Lỗi kết nối Server");
        }
      });
    </script>
  </body>
</html>
